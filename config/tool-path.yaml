# 外部工具目录约定。
# 注意：本文件只登记脚本文件名，不是运行时硬编码路径；不包含用户真实 F 盘路径。
# Agent 必须将用户提供的工具目录通过 --tools 参数传给 scripts/batch_runner.py。
tool_root: null
tools:
  scan:
    file: "scan_product_images.py"
    interface: "match_image_number"
  ocr:
    file: "ocr_rename_images.py"
    interface: "init_ocr,extract_text_from_image,clean_to_filename"
  mask:
    file: "batch_add_white_mask.py"
    interface: "process_image"
